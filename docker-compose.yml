version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE_URL=file:/app/data/seo_auditor.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - data:/app/data
    restart: always
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python worker.py
    environment:
      - DATABASE_URL=file:/app/data/seo_auditor.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - data:/app/data
    restart: always
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  data:
